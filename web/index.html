<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>ZebraRedact — Redact Sensitive Data Before Sending to AI</title>
    <meta name="description" content="Paste text, redact names, emails, and PII with one click, send safely to ChatGPT, Claude, or Gemini, then restore original values inline. Free, no signup, runs in your browser." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zebraredact.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zebraredact.com/" />
    <meta property="og:title" content="ZebraRedact — Redact Sensitive Data Before Sending to AI" />
    <meta property="og:description" content="Paste text, redact names, emails, and PII with one click, send safely to ChatGPT, Claude, or Gemini, then restore original values inline. Free, no signup, runs in your browser." />
    <meta property="og:image" content="https://zebraredact.com/og-image.png" />
    <meta property="og:site_name" content="ZebraRedact" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZebraRedact — Redact Sensitive Data Before Sending to AI" />
    <meta name="twitter:description" content="Paste text, redact names, emails, and PII with one click, send safely to any AI. Free, no signup, runs in your browser." />
    <meta name="twitter:image" content="https://zebraredact.com/og-image.png" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <script>
      // Apply saved theme before React loads to prevent flash
      ;(function(){var t=localStorage.getItem('zr:theme');if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
